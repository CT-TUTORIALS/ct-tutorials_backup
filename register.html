<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C&T Tutorials | Student Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    /* HEADER / HERO */
    .hero {
      background-color: #1f3c88;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .hero p {
      color: #eaeaea;
      max-width: 800px;
      margin: 10px auto 0;
      font-size: 15px;
    }

    .slogan {
      font-style: italic;
      font-weight: bold;
      margin-top: 10px;
    }

    /* FORM SECTION */
    .section {
      max-width: 700px;
      margin: 30px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 6px;
    }

    h2 {
      color: #1f3c88;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #1f3c88;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #162d66;
    }

    .consent {
      margin-top: 15px;
      font-size: 13px;
    }

    .consent input {
      margin-right: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #777;
    }

    a.back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #1f3c88;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="hero">
    <!-- SVG LOGO -->
    <svg width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="42"
            font-family="Arial, Helvetica, sans-serif"
            font-size="40"
            font-weight="700"
            fill="#ffffff">
        C<tspan fill="#F39C12">&</tspan>T
      </text>

      <line x1="0" y1="48" x2="95" y2="48"
            stroke="#ffffff"
            stroke-width="2"/>

      <text x="0" y="65"
            font-family="Arial, Helvetica, sans-serif"
            font-size="16"
            letter-spacing="2"
            fill="#eaeaea">
        TUTORIALS
      </text>
    </svg>

    <p class="slogan">Your academic support partner</p>
    <p>Complete the registration form below to get started with C&T Tutorials.</p>
  </div>

  <!-- REGISTRATION FORM -->
  <div class="section">
    <h2>Student Registration Form</h2>

    <form action="https://formspree.io/f/mlgbjkwq" method="POST">

      <label>Full Name</label>
      <input type="text" name="Full Name" required>

      <label>Email Address</label>
      <input type="email" name="Email" required>

      <label>Phone Number</label>
      <input type="tel" name="Phone Number" required>

      <label>Institution</label>
      <input type="text" name="Institution">

      <label>Subject(s) / Course</label>
      <input type="text" name="Subjects" required>

      <label>Level of Study</label>
      <select name="Level of Study" required>
        <option value="">Select level</option>
        <option>High School</option>
        <option>Foundation</option>
        <option>Undergraduate</option>
        <option>Postgraduate</option>
      </select>

      <label>Preferred Tutoring Mode</label>
      <select name="Tutoring Mode">
        <option>Online</option>
        <option>In-person</option>
        <option>Hybrid</option>
      </select>

      <label>Additional Information</label>
      <textarea name="Additional Information" rows="4"></textarea>

      <!-- CONSENT CHECKBOX -->
      <div class="consent">
        <input type="checkbox" required>
        I have read and agree to the <a href="index.html#policies">Business Policies</a> and <a href="index.html#disclaimer">Disclaimer & Disclosure</a>.
      </div>

      <button type="submit">Submit Registration</button>
    </form>

    <a href="index.html" class="back">← Back to Home</a>
  </div>

  <footer>
    © 2026 C&T Tutorials | Independent Academic Support Services
  </footer>

</body>
</html>

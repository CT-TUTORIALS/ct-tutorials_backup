<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C&T Tutorials | Student Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #1f3c88;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #162d66;
    }
    .disclaimer {
      font-size: 12px;
      color: #555;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>C&T TUTORIALS<br>Student Registration</h2>

    <form action="https://formspree.io/f/mlgbjkwq" method="POST">

      <label>Full Name</label>
      <input type="text" name="Full Name" required>

      <label>Email Address</label>
      <input type="email" name="Email" required>

      <label>Phone Number</label>
      <input type="tel" name="Phone Number" required>

      <label>Institution</label>
      <input type="text" name="Institution">

      <label>Subject(s) / Course</label>
      <input type="text" name="Subjects" required>

      <label>Level of Study</label>
      <select name="Level of Study" required>
        <option value="">Select level</option>
        <option>High School</option>
        <option>Foundation</option>
        <option>Undergraduate</option>
        <option>Postgraduate</option>
      </select>

      <label>Preferred Tutoring Mode</label>
      <select name="Tutoring Mode">
        <option>Online</option>
        <option>In-person</option>
        <option>Hybrid</option>
      </select>

      <label>Additional Information</label>
      <textarea name="Additional Information" rows="4"></textarea>

      <div class="disclaimer">
        <input type="checkbox" required>
        I confirm that the information provided is accurate. I acknowledge that
        C&T TUTORIALS is an independent tutoring service and not affiliated with
        any academic institution. I understand that tutoring support does not
        guarantee academic results.
      </div>

      <button type="submit">Submit Registration</button>
    </form>
  </div>
</body>
</html>
